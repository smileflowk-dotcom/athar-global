name: NVIDIA ALCHEMI Carbonate vs Malonate V6
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/alchemi_carbonate_malonate_v6.py"
      - ".github/workflows/alchemi-carbonate-malonate-v6.yml"
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile scripts/alchemi_carbonate_malonate_v6.py
      - name: Install scientific stack
        run: |
          python -m pip install --upgrade pip
          pip install "nvalchemi-toolkit[aimnet]" rdkit
      - name: Run focused validation
        run: python scripts/alchemi_carbonate_malonate_v6.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alchemi-carbonate-malonate-v6
          path: 03-validation/alchemi-carbonate-malonate-v6.json
          if-no-files-found: ignore
