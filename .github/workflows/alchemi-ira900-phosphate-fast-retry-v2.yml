name: ALCHEMI IRA900 Phosphate Fast Retry V2
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/alchemi_ira900_phosphate_fast_retry_v2.py"
      - ".github/workflows/alchemi-ira900-phosphate-fast-retry-v2.yml"
jobs:
  phosphate-fast-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile scripts/alchemi_ira900_phosphate_fast_retry_v2.py
      - name: Install verified ALCHEMI stack
        run: |
          python -m pip install --upgrade pip
          pip install "nvalchemi-toolkit[aimnet]" rdkit
      - name: Run targeted phosphate retry
        run: python scripts/alchemi_ira900_phosphate_fast_retry_v2.py
      - name: Validate output
        if: always()
        run: |
          python -c 'import json, pathlib; p=pathlib.Path("03-validation/alchemi-ira900-phosphate-fast-retry-v2.json"); print("OUTPUT_EXISTS", p.exists()); r=json.load(open(p)) if p.exists() else {}; print("STATUS", r.get("status")); [print(k, "shift", v.get("hydration_shift_0_to_9_eV"), "wet_pairs", v.get("high_9h2o",{}).get("valid_pairs")) for k,v in r.get("summary",{}).items()]'
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alchemi-ira900-phosphate-fast-retry-v2
          path: 03-validation/alchemi-ira900-phosphate-fast-retry-v2.json
          if-no-files-found: ignore
