name: ALCHEMI IRA910 HPO4 Gate D V1
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/alchemi_ira910_hpo4_gate_d_v1.py"
      - ".github/workflows/alchemi-ira910-hpo4-gate-d-v1.yml"
jobs:
  gate-d:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile scripts/alchemi_ira910_hpo4_gate_d_v1.py
      - name: Install NVIDIA ALCHEMI stack
        run: |
          python -m pip install --upgrade pip
          pip install "nvalchemi-toolkit[aimnet]" rdkit
      - name: Import smoke test
        run: |
          python - <<'PY'
          import torch
          from rdkit import Chem
          from nvalchemi.data import AtomicData, Batch
          from nvalchemi.dynamics.optimizers.fire2 import FIRE2
          from nvalchemi.dynamics.base import ConvergenceHook, DynamicsStage
          from nvalchemi.models.aimnet2 import AIMNet2Wrapper
          print("ALCHEMI_IMPORT_OK")
          print("torch", torch.__version__)
          print("cuda_available", torch.cuda.is_available())
          print("rdkit_ok", Chem.MolFromSmiles("O=C=O") is not None)
          PY
      - name: Run targeted IRA910 HPO4 Gate D
        run: python scripts/alchemi_ira910_hpo4_gate_d_v1.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alchemi-ira910-hpo4-gate-d-v1
          path: 03-validation/alchemi-ira910-hpo4-gate-d-v1.json
          if-no-files-found: ignore
