name: NVIDIA ALCHEMI Moisture CO2 Ensemble V2
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/alchemi_moisture_co2_ensemble_v2.py"
      - ".github/workflows/alchemi-moisture-co2-ensemble-v2.yml"
jobs:
  ensemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile scripts/alchemi_moisture_co2_ensemble_v2.py
      - name: Install scientific stack
        run: |
          python -m pip install --upgrade pip
          pip install "nvalchemi-toolkit[aimnet]" rdkit
      - name: Run moisture CO2 ensemble
        run: python scripts/alchemi_moisture_co2_ensemble_v2.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alchemi-moisture-co2-ensemble-v2
          path: 03-validation/alchemi-moisture-co2-ensemble-v2.json
          if-no-files-found: ignore
