name: GFN1 IRA900 P2O7 Crosscheck V2

on:
  push:
    branches: [main]
    paths:
      - "scripts/xtb_gfn1_ira900_p2o7_crosscheck_v2.py"
      - ".github/workflows/gfn1-ira900-p2o7-crosscheck-v2.yml"
  workflow_dispatch:

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent stack
        run: |
          python -m pip install --upgrade pip
          pip install numpy ase rdkit tblite
      - name: Run GFN1-xTB cross-check
        run: python scripts/xtb_gfn1_ira900_p2o7_crosscheck_v2.py
      - name: Print summary
        run: |
          python - <<'PY'
          import json
          p="03-validation/xtb-gfn1-ira900-p2o7-crosscheck-v2.json"
          r=json.load(open(p))
          print("STATUS",r["status"])
          for k,v in r["summary"].items():
              print(k,"shift",v["hydration_shift_0_to_9_eV"],"pairs",v["valid_pairs"])
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: xtb-gfn1-ira900-p2o7-crosscheck-v2
          path: 03-validation/xtb-gfn1-ira900-p2o7-crosscheck-v2.json
