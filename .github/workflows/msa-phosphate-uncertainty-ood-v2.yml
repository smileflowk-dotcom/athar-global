name: MSA Phosphate Uncertainty OOD V2
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/msa_phosphate_uncertainty_ood_v2.py"
      - ".github/workflows/msa-phosphate-uncertainty-ood-v2.yml"
jobs:
  gate-b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile scripts/msa_phosphate_uncertainty_ood_v2.py
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl numpy scikit-learn lightgbm
      - name: Run Gate B uncertainty/OOD
        run: python scripts/msa_phosphate_uncertainty_ood_v2.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msa-phosphate-uncertainty-ood-v2
          path: 03-validation/msa-phosphate-uncertainty-ood-v2.json
          if-no-files-found: ignore
