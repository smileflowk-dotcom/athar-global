name: NVIDIA Moisture-Swing Audit V0

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/nvidia_moisture_swing_audit_v0.py"
      - ".github/workflows/nvidia-moisture-swing-audit-v0.yml"

permissions:
  contents: write

jobs:
  nvidia-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.5
      - name: Run NVIDIA audit
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
        run: python scripts/nvidia_moisture_swing_audit_v0.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-moisture-swing-audit-v0
          path: |
            03-validation/nvidia-moisture-swing-audit-v0.json
            03-validation/nvidia-moisture-swing-audit-v0.md
          if-no-files-found: ignore
