name: Scale Engine V1 10K to 5
on:
  workflow_dispatch:
  push:
    paths:
      - "scale/**"
      - "scripts/run_scale_engine_v1.py"
      - ".github/workflows/scale-engine-v1.yml"
jobs:
  scale-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn lightgbm openpyxl
      - name: Syntax
        run: |
          python -m py_compile scale/candidate_factory_v1.py
          python -m py_compile scale/batch_scorer_v1.py
          python -m py_compile scale/diversity_filter_v1.py
          python -m py_compile scale/gates_v1.py
          python -m py_compile scale/aggregate_v1.py
          python -m py_compile scripts/run_scale_engine_v1.py
      - name: Run complete 10K to 5 pipeline
        run: python scripts/run_scale_engine_v1.py
      - name: Sanity gates
        run: |
          python - <<'PY'
          import pandas as pd, json
          assert len(pd.read_csv("scale/output/candidates-10k.csv")) == 10000
          assert len(pd.read_csv("scale/output/gate-1k.csv")) == 1000
          assert len(pd.read_csv("scale/output/gate-100.csv")) == 100
          assert len(pd.read_csv("scale/output/gate-20.csv")) == 20
          assert len(pd.read_csv("scale/output/gate-5.csv")) == 5
          r=json.load(open("scale/output/scale-ranking-v1.json"))
          assert r["scientific_status"]=="SCREENING_ONLY_NOT_VALIDATED"
          print("SCALE_ENGINE_SANITY_OK")
          PY
      - name: Upload scale artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scale-engine-v1-10k-to-5
          path: scale/output/
