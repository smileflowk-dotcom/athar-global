name: Scale Engine V2 Broader Discovery

on:
  push:
    branches: [main]
    paths:
      - "scale/candidate_factory_v2.py"
      - "scripts/run_scale_engine_v2_exploration.py"
      - ".github/workflows/scale-engine-v2-discovery.yml"
  workflow_dispatch:

jobs:
  discovery-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn lightgbm openpyxl
      - name: Syntax
        run: |
          python -m py_compile scale/candidate_factory_v2.py
          python -m py_compile scripts/run_scale_engine_v2_exploration.py
      - name: Run broader discovery
        run: python scripts/run_scale_engine_v2_exploration.py
      - name: Sanity
        run: |
          python - <<'PY'
          import json, pandas as pd
          assert len(pd.read_csv("scale/output-v2/candidates-20k.csv")) == 20000
          r=json.load(open("scale/output-v2/discovery-v2-summary.json"))
          assert r["scientific_status"]=="HYPOTHESIS_SCREENING_ONLY_NOT_VALIDATED"
          print("NEW_IONS",r["new_counterions"])
          print("TOP_NOVEL",r["top_novel_challengers"][:5])
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: scale-engine-v2-broader-discovery
          path: scale/output-v2/
