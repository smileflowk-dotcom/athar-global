name: Scale Engine V3 Next Challengers

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_v3_next_challengers.py"
      - ".github/workflows/scale-engine-v3-next-challengers.yml"
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn lightgbm openpyxl
      - name: Run V3
        run: python scripts/run_v3_next_challengers.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: scale-engine-v3-next-challengers
          path: scale/output-v3/
