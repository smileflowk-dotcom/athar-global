name: Scientific Dropout V0

on:
  workflow_dispatch:
  push:
    branches:
      - hackathon/scientific-workflow-pivot
    paths:
      - "scripts/scientific_dropout_v0.py"
      - ".github/workflows/scientific-dropout-v0.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyTorch CPU runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install requests

      - name: Run scientific vertical slice
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
        run: python scripts/scientific_dropout_v0.py

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scientific-dropout-v0
          if-no-files-found: ignore
          path: |
            03-validation/scientific-dropout-v0.json
            03-validation/scientific-dropout-v0.md
