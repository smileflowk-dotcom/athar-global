name: XTB IRA900 P2O7 Crosscheck V1

on:
  push:
    branches: [main]
    paths:
      - "scripts/xtb_ira900_p2o7_crosscheck_v1.py"
      - ".github/workflows/xtb-ira900-p2o7-crosscheck-v1.yml"
  workflow_dispatch:

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent scientific stack
        run: |
          python -m pip install --upgrade pip
          pip install numpy ase rdkit tblite
      - name: Run independent GFN2-xTB cross-check
        run: python scripts/xtb_ira900_p2o7_crosscheck_v1.py
      - name: Print summary
        run: |
          python - <<'PY'
          import json
          p="03-validation/xtb-ira900-p2o7-crosscheck-v1.json"
          r=json.load(open(p))
          print("STATUS",r["status"])
          for k,v in r["summary"].items():
              print(k,"shift",v["hydration_shift_0_to_9_eV"],"positive",v["positive_hydration_response"])
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: xtb-ira900-p2o7-crosscheck-v1
          path: 03-validation/xtb-ira900-p2o7-crosscheck-v1.json
